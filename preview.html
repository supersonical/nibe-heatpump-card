<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Card Preview</title>
<style>body{margin:0;padding:24px;background:#111827;font-family:system-ui}#c{max-width:560px;margin:auto}
.ctl{max-width:560px;margin:0 auto 12px;display:flex;gap:8px;flex-wrap:wrap}.ctl button{padding:6px 10px;border-radius:8px;border:0;cursor:pointer}</style>
</head><body>
<div class="ctl"><button data-m="Heating">Heating</button><button data-m="Hot water">Hot water</button><button data-m="Cooling">Cooling</button><button data-m="Off">Off</button><button data-b="on">Boost active</button><button data-b="off">Boost standby</button><button data-b="dis">Boost disabled</button></div>
<div id="c"></div>
<script>customElements.define('ha-card', class extends HTMLElement{});</script>
<script src="dist/nibe-heatpump-card.js"></script>
<script>
const S=(state,unit)=>({state:String(state),attributes:unit?{unit_of_measurement:unit}:{}});
const states={
 'sensor.priority_31029':S('Heating'),
 'sensor.current_outdoor_temperature_bt1_30002':S(-3.4,'°C'),
 'number.heating_curve_climate_system_1_40027':S(7),
 'sensor.energy_log_current_power_consumption_32306':S(1.42,'kW'),
 'sensor.s735_nibe_cop':S(3.84),
 'sensor.compressor_frequency_current_31047':S(68,'Hz'),
 'sensor.average_tempratur_house':S(21.6,'°C'),
 'sensor.hot_water_top_bt7_30009':S(51.2,'°C'),
 'sensor.hot_water_charging_bt6_30010':S(46.8,'°C'),
 'sensor.supply_line_bt2_30006':S(38.5,'°C'),
 'sensor.return_line_bt3_30008':S(32.1,'°C'),
 'sensor.flow_sensor_bf1_30041':S(14.2,'l/m'),
 'sensor.extr_air_bt21_30021':S(21.9,'°C'),
 'sensor.exh_air_bt20_30020':S(2.3,'°C'),
 'automation.heating_curve_cheap_electricity_boost_nordpool':S('on'),
 'binary_sensor.nordpool_cheap_heating_period':{state:'on',attributes:{},last_changed:new Date(Date.now()-5400e3).toISOString()},
 'sensor.nordpool_cheap_heating_plan':S('None (longest cheap run 3.0 h from Sun 04:00)'),
 'sensor.nordpool_kwh_se3_sek_3_10_025':{state:'0.61',attributes:{unit_of_measurement:'SEK/kWh',min:0.425,max:1.96,average:1.39}},
};
states['number.heating_curve_climate_system_1_40027']=S(6);
const card=document.createElement('nibe-heatpump-card');
card.setConfig({title:'NIBE S735'});
document.getElementById('c').appendChild(card);
const push=()=>{card.hass={states:{...states}}};
push();
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
 states['sensor.priority_31029']=S(b.dataset.m);
 states['sensor.compressor_frequency_current_31047']=S(b.dataset.m==='Off'?0:b.dataset.m==='Hot water'?95:68,'Hz');
 states['sensor.flow_sensor_bf1_30041']=S(b.dataset.m==='Off'?0:14.2,'l/m');
 push();});
document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const m=b.dataset.b;
 states['automation.heating_curve_cheap_electricity_boost_nordpool']=S(m==='dis'?'off':'on');
 states['binary_sensor.nordpool_cheap_heating_period']={...states['binary_sensor.nordpool_cheap_heating_period'],state:m==='on'?'on':'off'};
 states['number.heating_curve_climate_system_1_40027']=S(m==='on'?6:4);
 states['sensor.nordpool_kwh_se3_sek_3_10_025']={...states['sensor.nordpool_kwh_se3_sek_3_10_025'],state:m==='on'?'0.61':'1.61'};
 push();});
</script></body></html>
